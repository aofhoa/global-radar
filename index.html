<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Global Radar · 每日时事</title>
<style>
/* ===== Apple Design：白底 · 简约 · 层次阴影 ===== */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f5f7;
  --card:#ffffff;
  --text:#1d1d1f;
  --text2:#6e6e73;
  --text3:#86868b;
  --blue:#0071e3;
  --bull:#e02e2a;
  --bear:#1a9e4b;
  --neutral:#86868b;
  --hair:rgba(0,0,0,.08);
  --shadow:0 2px 12px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.05);
  --radius:18px;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','PingFang SC','Helvetica Neue','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;
  padding:0 0 64px;
  -webkit-font-smoothing:antialiased;
}
.container{max-width:1120px;margin:0 auto;padding:48px 24px 0}

/* Header */
.hd{margin-bottom:36px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px}
.hd-l h1{font-size:40px;font-weight:700;letter-spacing:-.8px;color:var(--text)}
.hd-l .sub{margin-top:8px;font-size:15px;color:var(--text2);display:flex;align-items:center;gap:8px}
.hd-l .dot{width:8px;height:8px;border-radius:50%;background:var(--bull);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.hd-r{display:flex;gap:24px}
.stat{text-align:center}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.5px}
.stat .l{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-top:2px}

/* Card */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px}

/* Section */
.sec{margin-top:44px}
.sec-h{font-size:24px;font-weight:700;letter-spacing:-.4px;margin-bottom:16px}
.sec-h small{font-size:13px;font-weight:400;color:var(--text3);margin-left:10px}

/* Radar grid */
.radar-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.rc{padding:24px}
.rc .rc-l{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;font-weight:600}
.rc .rc-v{font-size:32px;font-weight:700;letter-spacing:-.5px}
.rc .rc-s{font-size:14px;color:var(--text2);margin-top:8px;font-weight:400;line-height:1.6}
.gauge{width:100%;height:4px;background:rgba(0,0,0,.06);border-radius:2px;margin-top:12px;overflow:hidden}
.gauge-fill{height:100%;border-radius:2px;transition:width 1s ease}

/* Filter */
.filter{display:inline-flex;gap:4px;background:rgba(0,0,0,.045);border-radius:12px;padding:3px;margin-bottom:20px}
.fbtn{padding:7px 20px;border-radius:9px;border:none;background:transparent;color:var(--text2);font-size:14px;font-weight:500;cursor:pointer;transition:all .25s;font-family:inherit}
.fbtn.active{background:var(--card);color:var(--text);box-shadow:0 1px 6px rgba(0,0,0,.08)}

/* Event card */
.ev{padding:22px 24px;margin-bottom:10px}
.ev-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ev-rank{font-size:14px;font-weight:600;color:var(--text3);min-width:24px}
.ev-tag{padding:2px 10px;border-radius:6px;font-size:12px;font-weight:600;color:#fff}
.ev-score{font-weight:600;font-size:14px;color:var(--text2)}
.ev-score em{font-style:normal;font-weight:400;font-size:11px;opacity:.6}
.ev-stars{font-size:13px;letter-spacing:1px}
.ev h3{font-size:16px;font-weight:600;margin-bottom:6px;line-height:1.5}
.ev .sum{color:var(--text2);font-size:14px;margin-bottom:12px;line-height:1.7}
.ev-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text3);align-items:center}
.ev-meta a{color:var(--blue);text-decoration:none}
.ev-meta a:hover{text-decoration:underline}

/* Chain */
.chains{margin:12px 0;padding:14px 16px;border-radius:10px;background:rgba(0,0,0,.025);border:1px solid var(--hair)}
.chains .ch-l{font-size:11px;color:var(--text3);margin-bottom:8px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
.chain-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.chain-node{padding:4px 12px;border-radius:8px;font-size:13px;background:var(--card);border:1px solid var(--hair)}
.chain-node.trigger{border-color:rgba(0,0,0,.15);color:var(--text)}
.chain-node.mid{color:var(--text2)}
.chain-node.impact{font-weight:600}
.chain-arr{color:var(--text3)}

/* Tags */
.ind-tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.ind-tag{padding:3px 10px;border-radius:100px;font-size:12px;border:1px solid;background:rgba(0,0,0,.02)}

/* Key points */
.kp{display:flex;flex-direction:column;gap:8px}
.kp-item{display:flex;align-items:flex-start;gap:10px;padding:14px 20px;font-size:14px}
.kp-tag{flex-shrink:0;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;color:#fff}

/* Loading */
.loading-box{text-align:center;padding:48px;color:var(--text3);font-size:14px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,0,0,.08);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}

.footer{margin-top:56px;text-align:center;color:var(--text3);font-size:12px;line-height:1.9}
@media(max-width:768px){.hd{flex-direction:column;align-items:flex-start}.hd-r{gap:16px}}
</style>
</head>
<body>
<div class="container">
  <div class="hd">
    <div class="hd-l">
      <h1>Global Radar</h1>
      <div class="sub"><span class="dot"></span><span id="dateStr">…</span> · 全球事件 → A股影响 · 每 3 分钟自动刷新</div>
    </div>
    <div class="hd-r">
      <div class="stat"><div class="v" style="color:var(--bull)" id="bullCount">—</div><div class="l">利好</div></div>
      <div class="stat"><div class="v" style="color:var(--neutral)" id="sentiment">—</div><div class="l">情绪</div></div>
      <div class="stat"><div class="v" style="color:var(--bear)" id="bearCount">—</div><div class="l">利空</div></div>
      <div class="stat"><div class="v" id="totalCount">—</div><div class="l">事件</div></div>
    </div>
  </div>

  <div class="sec">
    <div class="radar-grid">
      <div class="card rc"><div class="rc-l">全球环境</div><div class="rc-v" id="envVal" style="color:var(--neutral)">—</div><div class="rc-s" id="envSub">加载中…</div></div>
      <div class="card rc"><div class="rc-l">风险指数</div><div class="rc-v" id="riskVal" style="color:var(--neutral)">—</div><div class="gauge"><div class="gauge-fill" id="riskGauge" style="width:50%;background:var(--neutral)"></div></div><div class="rc-s">0 安全 · 50 警戒 · 100 危机</div></div>
      <div class="card rc"><div class="rc-l">今日变量</div><div class="rc-s" id="topVars" style="margin-top:0;line-height:1.9">加载中…</div></div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-h">今日要点</div>
    <div class="kp" id="keyPoints"><div class="loading-box"><span class="spinner"></span>正在获取全球快讯…</div></div>
  </div>

  <div class="sec">
    <div class="sec-h">事件雷达 <small>实时</small></div>
    <div class="filter">
      <button class="fbtn active" onclick="filterEv('all',this)">全部</button>
      <button class="fbtn" onclick="filterEv('domestic',this)">国内</button>
      <button class="fbtn" onclick="filterEv('global',this)">全球</button>
    </div>
    <div id="eventList"><div class="loading-box"><span class="spinner"></span>正在分析事件…</div></div>
  </div>

  <div class="footer">数据来源：华尔街见闻 7×24 快讯 · 自动分类与情绪分析 · 仅供参考，不构成投资建议</div>
</div>

<script>
var API='https://api-one.wallstcn.com/apiv1/content/lives';
var CHANNELS=['global-channel','a-stock-channel','us-stock-channel'];
var LIMIT=40;
var REFRESH_MS=180000;

var BULL_KW=['利好','上涨','增长','突破','新高','大涨','飙升','回暖','复苏','提振','加速','扩大','支持','扶持','补贴','降息','宽松','反弹','走强','景气','超预期','涨停','放量','流入','获批','中标','签约','合作','开源','发布','推出'];
var BEAR_KW=['利空','下跌','下滑','暴跌','大跌','新低','萎缩','衰退','制裁','关税','战争','冲突','危机','违约','破产','下调','收紧','加息','承压','走弱','不及预期','跌停','缩量','流出','处罚','违规','调查','禁止','限制','封锁','袭击','警告'];
var DOMESTIC_KW=['中国','国内','A股','沪深','央行','国务院','证监会','商务部','发改委','工信部','财政部','人民币','北京','上海','深圳','港股','部委','中央','政策','规划','LPR','MLF','国债','省','市'];
var IND_MAP={
  '半导体':['芯片','半导体','晶圆','光刻','存储','AI','算力','GPU','英伟达','台积电','中芯','华虹','长鑫','兆易','北方华创','中微'],
  '新能源':['新能源','光伏','锂电','电池','储能','风电','氢能','充电桩','特斯拉','比亚迪','宁德','隆基'],
  '军工':['军工','国防','导弹','战斗机','航天','航空','船舶','雷达','卫星','无人机','军事'],
  '金融':['银行','券商','保险','金融','利率','LPR','MLF','信贷','央行','降息','加息','美联储','国债'],
  '消费':['消费','零售','白酒','食品','餐饮','旅游','家电','汽车','茅台','五粮液'],
  '医药':['医药','医疗','生物','疫苗','创新药','器械','恒瑞','药明','集采','FDA'],
  '石油石化':['原油','石油','天然气','OPEC','油价','石化','中石油','中石化','LNG'],
  '房地产':['房地产','地产','楼市','房价','土地','住建','万科'],
  'AI/科技':['人工智能','AI','大模型','机器人','自动驾驶','数据中心','云计算','算力','OpenAI','谷歌','苹果','华为','小米'],
  '农业':['农业','粮食','种业','猪肉','养殖','种植','化肥','厄尔尼诺','农产品'],
};

var allEvents=[];
var currentFilter='all';

function fetchChannel(ch){
  return fetch(API+'?channel='+ch+'&limit='+LIMIT)
    .then(function(r){return r.json()})
    .then(function(d){return (d.data&&d.data.items)||[]})
    .catch(function(){return []});
}

function loadAll(){
  Promise.all(CHANNELS.map(fetchChannel)).then(function(results){
    var seen={};
    var items=[];
    results.forEach(function(list){
      list.forEach(function(it){
        if(!seen[it.id]){seen[it.id]=true;items.push(it)}
      });
    });
    items.sort(function(a,b){return b.display_time-a.display_time});
    var cutoff=Date.now()/1000-86400;
    items=items.filter(function(it){return it.display_time>=cutoff});
    allEvents=items.map(analyze);
    render();
  });
}

function analyze(item){
  var text=item.content_text||'';
  var title=item.title||text.slice(0,60);
  var score=0;
  BULL_KW.forEach(function(kw){if(text.indexOf(kw)>-1)score++});
  BEAR_KW.forEach(function(kw){if(text.indexOf(kw)>-1)score--});
  var sentiment=score>0?'bull':(score<0?'bear':'neutral');
  var isDomestic=DOMESTIC_KW.some(function(kw){return text.indexOf(kw)>-1});
  var inds=[];
  Object.keys(IND_MAP).forEach(function(ind){
    if(IND_MAP[ind].some(function(kw){return text.indexOf(kw)>-1}))inds.push(ind);
  });
  if(!inds.length)inds.push('综合');
  var impact=Math.min(10,Math.max(3,5+Math.abs(score)));
  return{id:item.id,title:title,summary:text.length>200?text.slice(0,200)+'…':text,sentiment:sentiment,score:score,impact:impact,domestic:isDomestic,industries:inds.slice(0,3),time:item.display_time,uri:item.uri||''};
}

function render(){
  var bulls=allEvents.filter(function(e){return e.sentiment==='bull'}).length;
  var bears=allEvents.filter(function(e){return e.sentiment==='bear'}).length;
  var neutrals=allEvents.length-bulls-bears;
  document.getElementById('bullCount').textContent=bulls;
  document.getElementById('bearCount').textContent=bears;
  document.getElementById('totalCount').textContent=allEvents.length;
  var ratio=bulls/(bulls+bears||1);
  var sent=ratio>0.6?'偏多':(ratio<0.4?'偏空':'中性');
  document.getElementById('sentiment').textContent=sent;
  document.getElementById('envVal').textContent=sent;
  document.getElementById('envVal').style.color=ratio>0.6?'var(--bull)':(ratio<0.4?'var(--bear)':'var(--neutral)');
  document.getElementById('envSub').textContent='利好 '+bulls+' / 利空 '+bears+' / 中性 '+neutrals;
  var risk=Math.max(5,Math.min(95,Math.round(50+(bears-bulls)*2)));
  document.getElementById('riskVal').textContent=risk;
  document.getElementById('riskVal').style.color=risk>60?'var(--bear)':(risk<40?'var(--bull)':'var(--neutral)');
  document.getElementById('riskGauge').style.width=risk+'%';
  document.getElementById('riskGauge').style.background=risk>60?'var(--bear)':(risk<40?'var(--bull)':'var(--neutral)');

  var top3=allEvents.slice(0,3);
  var tv='';
  top3.forEach(function(e,i){
    var tag=e.sentiment==='bull'?'利好':(e.sentiment==='bear'?'利空':'中性');
    tv+=(i+1)+'. ['+tag+'] '+e.title.slice(0,40)+(e.title.length>40?'…':'')+'<br>';
  });
  document.getElementById('topVars').innerHTML=tv||'暂无数据';

  var now=new Date();
  document.getElementById('dateStr').textContent=now.getFullYear()+'-'+('0'+(now.getMonth()+1)).slice(-2)+'-'+('0'+now.getDate()).slice(-2)+' '+('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2);

  var kp=allEvents.slice().sort(function(a,b){return b.impact-a.impact}).slice(0,5);
  var kpHtml='';
  kp.forEach(function(e){
    var color=e.sentiment==='bull'?'var(--bull)':(e.sentiment==='bear'?'var(--bear)':'var(--neutral)');
    var tag=e.sentiment==='bull'?'利好':(e.sentiment==='bear'?'利空':'中性');
    kpHtml+='<div class="card kp-item"><span class="kp-tag" style="background:'+color+'">'+tag+'</span><span>'+e.title.slice(0,80)+'</span></div>';
  });
  document.getElementById('keyPoints').innerHTML=kpHtml;
  renderEvents();
}

function renderEvents(){
  var list=allEvents;
  if(currentFilter==='domestic')list=list.filter(function(e){return e.domestic});
  if(currentFilter==='global')list=list.filter(function(e){return !e.domestic});
  list=list.slice(0,30);
  var html='';
  list.forEach(function(e,i){
    var color=e.sentiment==='bull'?'var(--bull)':(e.sentiment==='bear'?'var(--bear)':'var(--neutral)');
    var tag=e.sentiment==='bull'?'利好':(e.sentiment==='bear'?'利空':'中性');
    var dir=e.sentiment==='bull'?'▲':(e.sentiment==='bear'?'▼':'●');
    var stars='';
    var starN=Math.min(5,Math.ceil(e.impact/2));
    for(var s=0;s<5;s++)stars+=s<starN?'★':'☆';
    var t=new Date(e.time*1000);
    var timeStr=('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);
    var mid=e.domestic?'国内政策/市场信号传导':'全球市场联动传导';
    var impact='A股'+e.industries.join('/')+(e.sentiment==='bull'?'受益':(e.sentiment==='bear'?'承压':'关注'));
    html+='<div class="card ev">'
      +'<div class="ev-top"><span class="ev-rank">'+(i+1)+'</span>'
      +'<span class="ev-tag" style="background:'+color+'">'+tag+'</span>'
      +'<span class="ev-score">'+e.impact.toFixed(1)+'<em>/10</em></span>'
      +'<span class="ev-stars" style="color:'+color+'">'+stars+'</span>'
      +'<span style="color:'+color+';font-size:14px">'+dir+'</span>'
      +'<span class="ind-tag" style="border-color:var(--hair);color:var(--text3)">'+(e.domestic?'国内':'全球')+'</span></div>'
      +'<h3>'+e.title+'</h3>'
      +'<div class="sum">'+e.summary+'</div>'
      +'<div class="chains"><div class="ch-l">传导路径</div><div class="chain-row">'
      +'<span class="chain-node trigger">'+e.title.slice(0,24)+'</span>'
      +'<span class="chain-arr">→</span>'
      +'<span class="chain-node mid">'+mid+'</span>'
      +'<span class="chain-arr">→</span>'
      +'<span class="chain-node impact" style="color:'+color+'">'+impact+'</span>'
      +'</div></div>'
      +'<div class="ind-tags">'+e.industries.map(function(ind){return '<span class="ind-tag" style="border-color:'+color+';color:'+color+'">'+ind+'</span>'}).join('')+'</div>'
      +'<div class="ev-meta"><span>'+timeStr+'</span>'+(e.uri?'<a href="'+e.uri+'" target="_blank" rel="noopener">华尔街见闻 →</a>':'')+'</div>'
      +'</div>';
  });
  document.getElementById('eventList').innerHTML=html||'<div class="loading-box">暂无事件</div>';
}

function filterEv(f,btn){
  currentFilter=f;
  document.querySelectorAll('.fbtn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  renderEvents();
}

loadAll();
setInterval(loadAll,REFRESH_MS);
</script>
</body>
</html>
