<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Global Radar | 每日时事</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f4f1ec;
  --text:#1a1816;
  --text2:#5a5550;
  --text3:#7a7570;
  --text4:#a09890;
  --glass:rgba(255,255,255,.55);
  --glass-border:rgba(255,255,255,.65);
  --bull:#b47355;
  --bear:#6b8f71;
  --neutral:#9a917e;
  --radius:18px;
}
body{
  font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh;color:var(--text);line-height:1.7;font-size:15px;
  background:var(--bg);overflow-x:hidden;
}

/* ── Ambient Background ─────────────────── */
.bg{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;
  background:
    radial-gradient(ellipse 120% 80% at 15% 20%, rgba(200,185,165,.35) 0%, transparent 60%),
    radial-gradient(ellipse 100% 90% at 85% 75%, rgba(180,190,195,.3) 0%, transparent 55%),
    radial-gradient(ellipse 80% 60% at 50% 50%, rgba(210,195,180,.2) 0%, transparent 50%),
    linear-gradient(160deg,#f4f1ec 0%,#ece8e1 40%,#e8e4dd 100%);
}
.bg-grain{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:.3;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  mix-blend-mode:overlay;
}

/* ── Liquid Glass ───────────────────────── */
.glass{
  background:var(--glass);
  backdrop-filter:blur(32px) saturate(1.3);
  -webkit-backdrop-filter:blur(32px) saturate(1.3);
  border:1px solid var(--glass-border);
  border-radius:var(--radius);
  position:relative;overflow:hidden;
  transition:all .4s cubic-bezier(.25,.46,.45,.94);
  box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.03);
}
.glass::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent 5%,rgba(255,255,255,.7) 30%,rgba(255,255,255,.9) 50%,rgba(255,255,255,.7) 70%,transparent 95%);
  pointer-events:none;
}
.glass:hover{box-shadow:0 2px 8px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.04)}
.glass-strong{
  background:rgba(255,255,255,.65);
  backdrop-filter:blur(48px) saturate(1.4);
  -webkit-backdrop-filter:blur(48px) saturate(1.4);
  border:1px solid rgba(255,255,255,.7);
  border-radius:20px;
  box-shadow:0 1px 4px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.04);
}
.glass-strong::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent 5%,rgba(255,255,255,.8) 25%,rgba(255,255,255,1) 50%,rgba(255,255,255,.8) 75%,transparent 95%);
  pointer-events:none;
}

/* ── Layout ─────────────────────────────── */
.wrap{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:24px 32px 80px}

/* ── Header ─────────────────────────────── */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:28px 32px;margin-bottom:28px;flex-wrap:wrap;gap:16px}
.hdr-left h1{font-size:1.5em;font-weight:300;color:var(--text);letter-spacing:2px;text-transform:uppercase}
.hdr-left h1 strong{font-weight:600;letter-spacing:0}
.hdr-left .sub{color:var(--text2);font-size:.82em;margin-top:6px;font-weight:300;letter-spacing:.5px}
.hdr-right{display:flex;gap:28px;align-items:center}
.hdr-stat{text-align:center}
.hdr-stat .val{font-size:1.6em;font-weight:200;line-height:1.2;letter-spacing:-.5px}
.hdr-stat .lbl{font-size:.62em;color:#6a6560;text-transform:uppercase;letter-spacing:2px;margin-top:3px;font-weight:400}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bull);margin-right:6px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.divider{height:1px;border:none;background:linear-gradient(90deg,transparent,rgba(0,0,0,.08) 20%,rgba(0,0,0,.08) 80%,transparent);margin:0 0 28px}

/* ── Radar Grid ─────────────────────────── */
.radar{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:32px}
.rc{padding:26px}
.rc .rc-label{font-size:.62em;color:#6a6560;text-transform:uppercase;letter-spacing:2.5px;margin-bottom:12px;font-weight:500}
.rc .rc-value{font-size:2.2em;font-weight:200;line-height:1;letter-spacing:-1px}
.rc .rc-sub{font-size:.82em;color:var(--text2);margin-top:10px;font-weight:300;line-height:1.6}
.gauge{width:100%;height:3px;background:rgba(0,0,0,.06);border-radius:2px;margin-top:14px;overflow:hidden}
.gauge-fill{height:100%;border-radius:2px;transition:width 1.2s cubic-bezier(.25,.46,.45,.94)}

/* ── Section ────────────────────────────── */
.sec{margin-bottom:36px}
.sec-title{
  font-size:.72em;font-weight:500;color:#6a6560;margin-bottom:18px;
  text-transform:uppercase;letter-spacing:3px;
  display:flex;align-items:center;gap:12px;
}
.sec-title .badge{font-size:.8em;padding:2px 10px;border-radius:10px;font-weight:400;background:rgba(0,0,0,.04);color:#6a6560;letter-spacing:1px}

/* ── Filter ─────────────────────────────── */
.filter-bar{
  display:flex;gap:6px;margin-bottom:22px;
  background:rgba(255,255,255,.3);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.5);border-radius:12px;padding:4px;width:fit-content;
}
.filter-btn{
  padding:8px 20px;border-radius:9px;border:none;background:transparent;color:var(--text3);
  font-size:.82em;font-weight:500;cursor:pointer;transition:all .3s;font-family:inherit;letter-spacing:.5px;
}
.filter-btn:hover{color:#3a3632;background:rgba(255,255,255,.4)}
.filter-btn.active{background:rgba(255,255,255,.7);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.06)}

/* ── Event Cards ────────────────────────── */
.ev{padding:24px 28px;margin-bottom:12px}
.ev-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ev-rank{font-size:1.1em;font-weight:200;color:#8a8279;min-width:28px;font-variant-numeric:tabular-nums}
.ev-tag{padding:3px 10px;border-radius:6px;font-size:.7em;font-weight:500;color:#fff;letter-spacing:.5px}
.ev-score{font-weight:300;font-size:.9em;color:var(--text2)}
.ev-score em{font-style:normal;font-weight:200;font-size:.65em;opacity:.6}
.ev-dir{font-size:.85em}
.ev h3{font-size:1em;font-weight:500;color:var(--text);margin-bottom:8px;line-height:1.6}
.ev .summary{color:#4a4540;font-size:.86em;margin-bottom:14px;line-height:1.8;font-weight:300}
.ev-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.76em;color:var(--text3);align-items:center}
.ev-meta a{color:var(--text2);text-decoration:none;transition:color .2s}
.ev-meta a:hover{color:var(--text)}

/* Chain */
.chains{margin:14px 0 10px;padding:16px 18px;border-radius:12px;background:rgba(0,0,0,.02);border:1px solid rgba(0,0,0,.04)}
.chains .ch-label{font-size:.6em;color:var(--text3);margin-bottom:10px;text-transform:uppercase;letter-spacing:2.5px;font-weight:500}
.chain-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.84em}
.chain-node{padding:5px 14px;border-radius:8px;font-size:.88em;background:rgba(255,255,255,.5);border:1px solid rgba(0,0,0,.06);backdrop-filter:blur(8px);letter-spacing:.2px}
.chain-node.trigger{border-color:rgba(138,126,114,.25);color:#6b6158;background:rgba(138,126,114,.06)}
.chain-node.mid{border-color:rgba(160,140,120,.2);color:#8a7a68;background:rgba(160,140,120,.05)}
.chain-node.impact{border-color:rgba(180,115,85,.3);color:#9a6e50;font-weight:500;background:rgba(180,115,85,.06)}
.chain-arr{color:var(--text4)}

/* Industry tags */
.ind-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.ind-tag{padding:4px 12px;border-radius:12px;font-size:.72em;border:1px solid;background:rgba(255,255,255,.3);backdrop-filter:blur(6px)}

/* ── Footer ─────────────────────────────── */
.ftr{text-align:center;padding:36px 0 0;color:var(--text3);font-size:.76em;letter-spacing:.5px}
.ftr .disclaimer{padding:18px 22px;border-radius:14px;margin-bottom:20px;font-size:.82em;color:var(--text2);line-height:1.8;font-weight:300;background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(16px)}

/* ── Loading ────────────────────────────── */
.loading-box{text-align:center;padding:60px;color:var(--text4);font-size:.9em}
.loading-box .spinner{display:inline-block;width:20px;height:20px;border:2px solid rgba(0,0,0,.06);border-top-color:#8a7e72;border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Responsive ─────────────────────────── */
@media(max-width:768px){
  .wrap{padding:14px 16px 60px}
  .hdr{flex-direction:column;align-items:flex-start;padding:20px 22px}
  .radar{grid-template-columns:1fr 1fr}
  .hdr-left h1{font-size:1.2em}
}
@media(max-width:480px){.radar{grid-template-columns:1fr}.hdr-right{gap:18px}}

/* Back to top */
.to-top{
  position:fixed;bottom:28px;right:28px;z-index:100;
  width:44px;height:44px;border-radius:50%;border:none;
  background:rgba(255,255,255,.6);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.6);box-shadow:0 2px 12px rgba(0,0,0,.08);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none;
}
.to-top.show{opacity:1;transform:translateY(0);pointer-events:auto}
.to-top svg{width:18px;height:18px;fill:none;stroke:#5a524a;stroke-width:2;stroke-linecap:round}
</style>
</head>
<body>
<div class="bg"></div>
<div class="bg-grain"></div>

<div class="wrap">
<!-- Header -->
<div class="hdr glass-strong">
  <div class="hdr-left">
    <h1>Global <strong>Radar</strong></h1>
    <div class="sub"><span class="live-dot"></span><span id="dateStr">…</span> &nbsp;&middot;&nbsp; 全球事件 &rarr; A股影响分析 &nbsp;&middot;&nbsp; 每 3 分钟自动刷新</div>
  </div>
  <div class="hdr-right">
    <div class="hdr-stat"><div class="val" style="color:var(--bull)" id="bullCount">—</div><div class="lbl">利好</div></div>
    <div class="hdr-stat"><div class="val" style="color:var(--neutral)" id="sentiment">—</div><div class="lbl">情绪</div></div>
    <div class="hdr-stat"><div class="val" style="color:var(--bear)" id="bearCount">—</div><div class="lbl">利空</div></div>
    <div class="hdr-stat"><div class="val" style="color:#8a8279" id="totalCount">—</div><div class="lbl">事件</div></div>
  </div>
</div>

<hr class="divider">

<!-- Radar Overview -->
<div class="radar">
  <div class="rc glass">
    <div class="rc-label">全球环境</div>
    <div class="rc-value" id="envVal" style="color:var(--neutral)">—</div>
    <div class="rc-sub" id="envSub">加载中…</div>
  </div>
  <div class="rc glass">
    <div class="rc-label">风险指数</div>
    <div class="rc-value" id="riskVal" style="color:var(--neutral)">—</div>
    <div class="gauge"><div class="gauge-fill" id="riskGauge" style="width:50%;background:var(--neutral)"></div></div>
    <div class="rc-sub">0 安全 &ensp;&middot;&ensp; 50 警戒 &ensp;&middot;&ensp; 100 危机</div>
  </div>
  <div class="rc glass">
    <div class="rc-label">今日变量</div>
    <div class="rc-sub" id="topVars" style="margin-top:8px;line-height:1.9;color:#4a4540">加载中…</div>
  </div>
</div>

<!-- Key Points -->
<div class="sec"><div class="sec-title">今日要点</div><div id="keyPoints" style="display:flex;flex-direction:column;gap:8px"><div class="loading-box glass"><span class="spinner"></span>正在获取全球快讯…</div></div></div>

<!-- Events -->
<div class="sec">
  <div class="sec-title">事件雷达 <span class="badge">实时</span></div>
  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterEv('all',this)">全部</button>
    <button class="filter-btn" onclick="filterEv('domestic',this)">国内</button>
    <button class="filter-btn" onclick="filterEv('global',this)">全球</button>
  </div>
  <div id="eventList"><div class="loading-box glass"><span class="spinner"></span>正在分析事件…</div></div>
</div>

<!-- Footer -->
<div class="ftr">
  <div class="disclaimer">数据来源：华尔街见闻 7×24 快讯（实时）· 自动分类与情绪分析 · 仅供参考，不构成投资建议</div>
  <p>Global Radar · 每日时事 · 自动更新</p>
</div>
</div>

<button class="to-top" id="toTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">
  <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
</button>

<script>
// ── Config ─────────────────────────────────────────────────────
var API='https://api-one.wallstcn.com/apiv1/content/lives';
var CHANNELS=['global-channel','a-stock-channel','us-stock-channel'];
var LIMIT=40;
var REFRESH_MS=180000; // 3 min

// ── Sentiment keywords ─────────────────────────────────────────
var BULL_KW=['利好','上涨','增长','突破','新高','大涨','飙升','回暖','复苏','提振','加速','扩大','支持','扶持','补贴','降息','宽松','反弹','走强','景气','超预期','创新高','涨停','放量','资金流入','获批','中标','签约','合作','开源','发布','推出'];
var BEAR_KW=['利空','下跌','下滑','暴跌','大跌','新低','萎缩','衰退','制裁','关税','战争','冲突','危机','违约','破产','下调','收紧','加息','承压','走弱','不及预期','跌停','缩量','资金流出','处罚','违规','调查','禁止','限制','封锁','袭击','警告'];
var DOMESTIC_KW=['中国','国内','A股','沪深','央行','国务院','证监会','商务部','发改委','工信部','财政部','人民币','北京','上海','深圳','港股','台','部委','中央','政策','规划','十五五','LPR','MLF','国债','地方','省','市'];

// ── Industry mapping ───────────────────────────────────────────
var IND_MAP={
  '半导体':['芯片','半导体','晶圆','光刻','存储','AI','算力','GPU','英伟达','台积电','中芯','华虹','长鑫','兆易','北方华创','中微'],
  '新能源':['新能源','光伏','锂电','电池','储能','风电','氢能','充电桩','特斯拉','比亚迪','宁德','隆基','阳光电源'],
  '军工':['军工','国防','导弹','战斗机','航天','航空','船舶','雷达','卫星','无人机','航行警告','军事'],
  '金融':['银行','券商','保险','金融','利率','LPR','MLF','信贷','央行','降息','加息','美联储','国债','基金'],
  '消费':['消费','零售','白酒','食品','餐饮','旅游','家电','汽车','服装','美妆','电商','茅台','五粮液'],
  '医药':['医药','医疗','生物','疫苗','创新药','CXO','器械','恒瑞','药明','百济','集采','FDA'],
  '石油石化':['原油','石油','天然气','OPEC','油价','石化','中石油','中石化','中海油','LNG','页岩'],
  '房地产':['房地产','地产','楼市','房价','土地','住建','公积金','保交楼','万科','碧桂园'],
  'AI/科技':['人工智能','AI','大模型','机器人','自动驾驶','数据中心','云计算','算力','OpenAI','谷歌','苹果','华为','小米'],
  '农业':['农业','粮食','种业','猪肉','养殖','种植','化肥','农药','厄尔尼诺','气候','农产品'],
};

// ── State ──────────────────────────────────────────────────────
var allEvents=[];
var currentFilter='all';

// ── Fetch ──────────────────────────────────────────────────────
function fetchChannel(ch){
  return fetch(API+'?channel='+ch+'&limit='+LIMIT)
    .then(function(r){return r.json()})
    .then(function(d){return (d.data&&d.data.items)||[]})
    .catch(function(){return []});
}

function loadAll(){
  Promise.all(CHANNELS.map(fetchChannel)).then(function(results){
    var seen={};
    var items=[];
    results.forEach(function(list){
      list.forEach(function(it){
        if(!seen[it.id]){
          seen[it.id]=true;
          items.push(it);
        }
      });
    });
    // Sort by time desc
    items.sort(function(a,b){return b.display_time-a.display_time});
    // Take last 24h
    var cutoff=Date.now()/1000-86400;
    items=items.filter(function(it){return it.display_time>=cutoff});
    allEvents=items.map(analyze);
    render();
  });
}

// ── Analyze ────────────────────────────────────────────────────
function analyze(item){
  var text=item.content_text||'';
  var title=item.title||text.slice(0,60);
  var score=0;
  BULL_KW.forEach(function(kw){if(text.indexOf(kw)>-1)score++});
  BEAR_KW.forEach(function(kw){if(text.indexOf(kw)>-1)score--});
  var sentiment=score>0?'bull':(score<0?'bear':'neutral');
  var isDomestic=DOMESTIC_KW.some(function(kw){return text.indexOf(kw)>-1});
  // Industries
  var inds=[];
  Object.keys(IND_MAP).forEach(function(ind){
    if(IND_MAP[ind].some(function(kw){return text.indexOf(kw)>-1})){
      inds.push(ind);
    }
  });
  if(inds.length===0)inds.push('综合');
  // Impact score (1-10)
  var impact=Math.min(10,Math.max(3,5+Math.abs(score)));
  return {
    id:item.id,
    title:title,
    summary:text.length>200?text.slice(0,200)+'…':text,
    full:text,
    sentiment:sentiment,
    score:score,
    impact:impact,
    domestic:isDomestic,
    industries:inds.slice(0,3),
    time:item.display_time,
    uri:item.uri||'',
  };
}

// ── Render ─────────────────────────────────────────────────────
function render(){
  var bulls=allEvents.filter(function(e){return e.sentiment==='bull'}).length;
  var bears=allEvents.filter(function(e){return e.sentiment==='bear'}).length;
  var neutrals=allEvents.length-bulls-bears;

  document.getElementById('bullCount').textContent=bulls;
  document.getElementById('bearCount').textContent=bears;
  document.getElementById('totalCount').textContent=allEvents.length;

  // Sentiment
  var ratio=bulls/(bulls+bears||1);
  var sent=ratio>0.6?'偏多':(ratio<0.4?'偏空':'● 中性');
  document.getElementById('sentiment').textContent=sent;
  document.getElementById('envVal').textContent=sent;
  document.getElementById('envVal').style.color=ratio>0.6?'var(--bull)':(ratio<0.4?'var(--bear)':'var(--neutral)');
  document.getElementById('envSub').textContent='利好 '+bulls+' / 利空 '+bears+' / 中性 '+neutrals;

  // Risk index
  var risk=Math.round(50+(bears-bulls)*2);
  risk=Math.max(5,Math.min(95,risk));
  document.getElementById('riskVal').textContent=risk;
  document.getElementById('riskVal').style.color=risk>60?'var(--bear)':(risk<40?'var(--bull)':'var(--neutral)');
  document.getElementById('riskGauge').style.width=risk+'%';
  document.getElementById('riskGauge').style.background=risk>60?'var(--bear)':(risk<40?'var(--bull)':'var(--neutral)');

  // Top variables
  var top3=allEvents.slice(0,3);
  var tv='';
  top3.forEach(function(e,i){
    var tag=e.sentiment==='bull'?'利好':(e.sentiment==='bear'?'利空':'中性');
    tv+=(i+1)+'. ['+tag+'] '+e.title.slice(0,40)+(e.title.length>40?'…':'')+'<br>';
  });
  document.getElementById('topVars').innerHTML=tv||'暂无数据';

  // Date
  var now=new Date();
  document.getElementById('dateStr').textContent=now.getFullYear()+'-'+('0'+(now.getMonth()+1)).slice(-2)+'-'+('0'+now.getDate()).slice(-2)+' '+('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2);

  // Key points (top 5 by impact)
  var kp=allEvents.slice().sort(function(a,b){return b.impact-a.impact}).slice(0,5);
  var kpHtml='';
  kp.forEach(function(e){
    var color=e.sentiment==='bull'?'var(--bull)':(e.sentiment==='bear'?'var(--bear)':'var(--neutral)');
    var tag=e.sentiment==='bull'?'利好':(e.sentiment==='bear'?'利空':'中性');
    kpHtml+='<div class="glass" style="display:flex;align-items:flex-start;gap:14px;padding:14px 20px;font-size:.88em;font-weight:300">'
      +'<span style="flex-shrink:0;padding:2px 8px;border-radius:4px;font-size:.72em;font-weight:500;color:#fff;background:'+color+'">'+tag+'</span>'
      +'<span>'+e.title.slice(0,80)+'</span></div>';
  });
  document.getElementById('keyPoints').innerHTML=kpHtml;

  // Event list
  renderEvents();
}

function renderEvents(){
  var list=allEvents;
  if(currentFilter==='domestic')list=list.filter(function(e){return e.domestic});
  if(currentFilter==='global')list=list.filter(function(e){return !e.domestic});
  list=list.slice(0,30);

  var html='';
  list.forEach(function(e,i){
    var color=e.sentiment==='bull'?'var(--bull)':(e.sentiment==='bear'?'var(--bear)':'var(--neutral)');
    var tag=e.sentiment==='bull'?'利好':(e.sentiment==='bear'?'利空':'中性');
    var dir=e.sentiment==='bull'?'&#9650;':(e.sentiment==='bear'?'&#9660;':'&#9679;');
    var stars='';
    var starN=Math.min(5,Math.ceil(e.impact/2));
    for(var s=0;s<5;s++)stars+=s<starN?'&#9733;':'&#9734;';
    var t=new Date(e.time*1000);
    var timeStr=('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);

    // Chain
    var mid=e.domestic?'国内政策/市场信号传导':'全球市场联动传导';
    var impact='A股'+e.industries.join('/')+'板块'+(e.sentiment==='bull'?'受益':(e.sentiment==='bear'?'承压':'关注'));

    html+='<div class="ev glass">'
      +'<div class="ev-top">'
      +'<span class="ev-rank">'+(i+1)+'</span>'
      +'<span class="ev-tag" style="background:'+color+'">'+tag+'</span>'
      +'<span class="ev-score">'+e.impact.toFixed(1)+'<em>/10</em></span>'
      +'<span style="color:#a08a68;font-size:.8em;letter-spacing:2px">'+stars+'</span>'
      +'<span class="ev-dir" style="color:'+color+'">'+dir+'</span>'
      +'<span class="badge" style="font-size:.68em;padding:2px 8px;border-radius:8px;background:rgba(0,0,0,.03);color:var(--text3)">'+(e.domestic?'国内':'全球')+'</span>'
      +'</div>'
      +'<h3>'+e.title+'</h3>'
      +'<div class="summary">'+e.summary+'</div>'
      +'<div class="chains"><div class="ch-label">传导路径</div><div class="chain-row">'
      +'<span class="chain-node trigger">'+e.title.slice(0,24)+'</span>'
      +'<span class="chain-arr">&rarr;</span>'
      +'<span class="chain-node mid">'+mid+'</span>'
      +'<span class="chain-arr">&rarr;</span>'
      +'<span class="chain-node impact">'+impact+'</span>'
      +'</div></div>'
      +'<div class="ind-tags">'+e.industries.map(function(ind){return '<span class="ind-tag" style="border-color:'+color+';color:'+color+'">'+ind+'</span>'}).join('')+'</div>'
      +'<div class="ev-meta"><span>'+timeStr+'</span>'+(e.uri?'<a href="'+e.uri+'" target="_blank" rel="noopener">华尔街见闻 &rarr;</a>':'')+'</div>'
      +'</div>';
  });
  document.getElementById('eventList').innerHTML=html||'<div class="loading-box glass">暂无事件</div>';
}

function filterEv(f,btn){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  renderEvents();
}

// ── Back to top ────────────────────────────────────────────────
window.addEventListener('scroll',function(){
  document.getElementById('toTop').classList.toggle('show',window.scrollY>400);
});

// ── Init ───────────────────────────────────────────────────────
loadAll();
setInterval(loadAll,REFRESH_MS);
</script>
</body>
</html>
